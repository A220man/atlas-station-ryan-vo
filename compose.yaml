version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: atlas-station-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/app/data
      - ./backend/.env:/app/.env:ro
    environment:
      - DATABASE_URL=sqlite:///./data/atlas.db
      - UPLOAD_DIR=/app/data/uploads
      - OUTPUT_DIR=/app/data/outputs
      - OIDC_ENABLED=true
      - OIDC_ISSUER_URL=http://keycloak:8080/realms/atlas
      - OIDC_CLIENT_ID=atlas-frontend
      - OIDC_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=http://localhost:3000/callback
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - atlas-network

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: atlas-station-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - atlas-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: atlas-station-keycloak
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - atlas-network

volumes:
  backend_data:
  keycloak_data:

networks:
  atlas-network:
    driver: bridge